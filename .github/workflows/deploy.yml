name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:

  deploy:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - billing
          - catalog
          - configserver
          - eurekaserver
          - gatewayserver
          - inventory
          - kitchenbar
          - ordering

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test AWS Connection
        run: aws sts get-caller-identity

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: |
          docker build \
            -t ${{ matrix.service }} \
            ./${{ matrix.service }}

      - name: Tag Image
        run: |
          docker tag \
            ${{ matrix.service }}:latest \
            ${{ steps.login-ecr.outputs.registry }}/kitchen-bar-service/${{ matrix.service }}:latest

      - name: Push Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/kitchen-bar-service/${{ matrix.service }}:latest